[package]
name = "tvoice"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = "3.6"
cpal = "0.16"
core-foundation = "0.10"
core-graphics = "0.25"
hound = "3.5"
tempfile = "3.14"
